<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Found | Showfile</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1026" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    nav { padding: 28px 40px; }
    main { flex: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 64px 24px 72px; text-align: center; }
    .code { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; color: var(--amber); }
    h1 { margin-top: 14px; font-size: clamp(2.3rem, 6.5vw, 4rem); line-height: 1.05; }
    .lede { margin: 18px auto 0; max-width: 40ch; color: var(--muted); font-size: 1.08rem; }
    .cues { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; }
    .cue {
      --gel-rgb: 255,179,71;
      display: block; padding: 20px 22px; border-radius: 14px; color: inherit; text-decoration: none;
      border: 1px solid rgba(var(--gel-rgb), 0.3);
      background: radial-gradient(130% 100% at 0% 0%, rgba(var(--gel-rgb), 0.3), transparent 68%), rgba(255,255,255,0.03);
      transition: border-color 0.2s;
    }
    .cue.cyan { --gel-rgb: 53,198,232; }
    .cue:hover, .cue:focus-visible { border-color: rgba(var(--gel-rgb), 0.65); outline: none; }
    .cue span { font-family: var(--font-mono); font-size: 12px; color: rgb(var(--gel-rgb)); }
    .cue strong { display: block; margin-top: 6px; font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; }
    .home { display: inline-block; margin-top: 34px; color: var(--muted); font-size: 14px; }
    .home:hover { color: var(--text); }
    @media (max-width: 600px) {
      nav { padding: 18px 20px; }
      .cues { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a class="sf-logo" href="/">
    <img class="sf-mark" src="/favicon.svg" alt="" width="18" height="18" />
    <span class="sf-word">Showfile</span>
  </a>
</nav>

<main>
  <p class="code">404</p>
  <h1 class="display">Nothing on this stage.</h1>
  <p class="lede">That page isn&rsquo;t here. The tools are:</p>

  <div class="cues">
    <a class="cue" href="/convert"><span>Q1</span><strong>Console Scene Converter</strong></a>
    <a class="cue cyan" href="/timecode-generator"><span>Q2</span><strong>LTC Timecode Generator</strong></a>
  </div>

  <a class="home" href="/">Back to Showfile</a>
</main>

</body>
</html>
