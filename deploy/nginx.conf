# Showfile's nginx, inside its own container only (Coolify app
# d9gxcwj3cphjfmikh41muopw, "Custom Nginx Configuration"). Coolify's default
# for a static app, plus a Cache-Control header.
#
# Pages, scripts and styles: no-cache, so the browser revalidates by ETag on
# every load (a 304 when nothing changed). The ES modules import each other by
# name, and an old cached module beside a new one stops the page (#40).
# Fonts and images rarely change and may be kept a day.

map $uri $cache_control {
    ~*\.(woff2?|png|jpe?g|webp|ico)$  "public, max-age=86400";
    default                            "no-cache";
}

server {
    add_header Cache-Control $cache_control always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
